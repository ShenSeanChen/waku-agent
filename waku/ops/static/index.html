<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Apply the stored theme before anything paints (see js/theme.js). -->
<script>try{var t=localStorage.getItem("waku-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Waku わく</title>
<link rel="icon" type="image/svg+xml" href="/static/waku-mark.svg">
<link rel="stylesheet" href="/static/design/fonts.css">
<link rel="stylesheet" href="/static/design/tokens.css">
<link rel="stylesheet" href="/static/design/type.css">
<link rel="stylesheet" href="/static/design/controls.css">
<link rel="stylesheet" href="/static/style.css"></head><body>
<nav id="nav" class="rail">
  <div class="r-top"><i class="mark" aria-hidden="true"></i><span class="r-name">WAKU</span>
    <button id="nav-collapse" class="r-chev" aria-label="Collapse the sidebar" aria-expanded="true">&#8249;</button></div>
  <div class="r-grp">System</div>
  <a href="#overview" data-v="overview" data-short="O" aria-label="Overview"><span class="lbl">Overview</span></a>
  <a href="#gateway" data-v="gateway" data-short="G" aria-label="Gateway"><span class="lbl">Gateway</span><span class="n" id="n-gw"></span></a>
  <a href="#loop" data-v="loop" data-short="L" aria-label="Loop"><span class="lbl">Loop</span><span class="n" id="n-loop"></span></a>
  <a href="#graph" data-v="graph" data-short="G" aria-label="Graph"><span class="lbl">Graph</span><span class="n" id="n-graph"></span></a>
  <a href="#memory" data-v="memory" data-short="M" aria-label="Memory"><span class="lbl">Memory</span><span class="n" id="n-mem"></span></a>
  <a href="#tools" data-v="tools" data-short="T" aria-label="Tools"><span class="lbl">Tools</span><span class="n" id="n-tools"></span></a>
  <a href="#database" data-v="database" data-short="D" aria-label="Database"><span class="lbl">Database</span><span class="n" id="n-db"></span></a>
  <a href="#ops" data-v="ops" data-short="O" aria-label="Ops"><span class="lbl">Ops</span><span class="n" id="n-ops"></span></a>
  <!-- Arena gets its own section. It was one row under System with the two
       races behind sub-tabs, on the reasoning that "Models" must not appear
       twice in the nav. It appears twice now, on purpose, because the two
       things are not the same word: SETUP > Models picks the model your agent
       USES, and ARENA > Model race puts ten of them through the loop and
       scores them. "race" carries that difference in one syllable, and hiding
       a whole half of the page behind a sub-tab cost more than the repetition
       ever did. -->
  <div class="r-grp">Arena</div>
  <a href="#compare/models" data-v="compare" data-sub="models" data-short="M" aria-label="Model race"><span class="lbl">Model race</span></a>
  <a href="#compare/memory" data-v="compare" data-sub="memory" data-short="M" aria-label="Memory race"><span class="lbl">Memory race</span></a>
  <div class="r-grp">Setup</div>
  <a href="#models" data-v="models" data-short="M" aria-label="Models"><span class="lbl">Models</span></a>
  <a href="#connections" data-v="connections" data-short="C" aria-label="Connections"><span class="lbl">Connections</span></a>
  <a href="#settings" data-v="settings" data-short="B" aria-label="Behaviour"><span class="lbl">Behaviour</span></a>
  <div class="r-bottom">
    <a class="r-gh" href="https://github.com/ShenSeanChen/waku-agent" target="_blank" rel="noopener noreferrer">GitHub</a>
    <button id="theme-toggle" onclick="cycleTheme()"></button>
  </div>
</nav>
<main>
  <header class="pagehead">
    <div class="ph-row"><h1 id="title">Overview</h1><div id="ph-actions" class="ph-actions"></div></div>
    <div class="sub" id="sub"></div>
  </header>
  <div id="view"></div>
</main>
<div class="resizer" id="dock-resizer" title="Drag to resize chat"></div>
<aside id="dock">
  <div class="dockhead">
    <span class="dt">Chat</span>
    <span class="arch-status"></span>
    <button id="dock-close" title="Collapse chat">&rsaquo;</button>
  </div>
  <div class="sesshead" style="padding:8px 2px 0">
    <button class="btn btn-secondary btn-sm sessbtn" onclick="newChat()">+ New chat</button>
    <button class="btn btn-secondary btn-sm sessbtn" onclick="toggleSessMenu(event)">History &#9662;</button>
    <button class="btn btn-secondary btn-sm sessbtn teletoggle" id="teletoggle" onclick="toggleTele()" title="Show/hide per-turn stats: gate decision, seconds, iterations, tools">stats</button>
    <button class="modelchip" id="modelchip" onclick="toggleModelMenu(event)" title="Switch the model for this chat">&hellip;</button>
  </div>
  <div class="chatlog" id="docklog"></div>
  <div class="chatbar">
    <input id="dmsg" placeholder="Message Waku&hellip;" autocomplete="off">
    <button id="mic" class="btn btn-secondary" title="Click to talk — local Whisper, no cloud"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="dsend" class="btn btn-primary">Send</button>
  </div>
</aside>
<button id="dock-reopen" class="btn btn-primary" title="Open chat">&lsaquo; Chat</button>
<!-- Frontend is split into focused classic scripts sharing one global scope
     (no build step, no modules). Order matters only in that main.js runs the
     bootstrap and must load LAST. See static/README.md for the file map. -->
<script src="/static/js/util.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/memory.js"></script>
<script src="/static/js/models.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/diagram.js"></script>
<script src="/static/js/graph.js"></script>
<script src="/static/js/views.js"></script>
<script src="/static/js/compare.js"></script>
<script src="/static/js/dock.js"></script>
<script src="/static/js/main.js"></script></body></html>
