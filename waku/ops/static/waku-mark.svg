       A favicon cannot read the page's tokens, so the two ink values are
       written out here and switched by the tab's own colour scheme. Without
       that the bird is the light theme's near-black on a dark tab strip, and
       simply is not there.

       The sunglasses are holes rather than paint - fill-rule evenodd leaves
       them transparent - so the tab shows through them. That is what makes
       them read as lenses in either theme instead of two pale blobs. -->
