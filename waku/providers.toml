# Every model provider Waku can talk to, as data.
#
# Adding one is this file plus a logo at waku/ops/static/logos/<name>.svg.
# Nothing else: the loop, the model picker, the pricing table, the spend chart
# and .env.example are all built from the rows below. Before 2026-09-22 a
# provider meant editing seven to nine files across three directories, four of
# them tests, and provider pull requests piled up because each one was a
# careful review rather than a glance at a table.
#
# Fields
#   kind         the wire format: "anthropic" or "openai". Nothing else exists;
#                the loop speaks Anthropic's Messages shape and the openai
#                adapter translates. A provider that speaks neither needs code,
#                not a row here.
#   key_env      which environment variable holds the key
#   base_url     omit for a provider whose SDK default is right (anthropic, openai)
#   model        the loop's default; small_model runs the gate and summaries
#   flagship/fast  the two models the chat switcher pins by default. Blank
#                falls back to model/small_model. These are starting points --
#                any model the live catalog lists is one click away.
#   catalog_url  where to LIST models, when that differs from base_url/models
#   base_url_env a provider-scoped endpoint override, for separately-issued
#                regional keys. Never reuse WAKU_BASE_URL for this: it is
#                global and would leak across providers.
#   key_url      where a human goes to get a key. It is printed when the key is
#                missing, so it has to be a real page, not ".env.example".
#   price        rough [in, out] dollars per million tokens, for the spend
#                estimate. Deliberately approximate and labelled "est" in the
#                UI; a live catalog overrides it per model where one exists.
#   endpoints    official regional alternatives, offered in the Models dialog.
#
# Model ids age. When one 404s, fix the row -- every past race and spend figure
# is derived at read time, so a correction here fixes history too.

[anthropic]
kind = "anthropic"
key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"
small_model = "claude-haiku-4-5-20251001"
catalog_url = "https://api.anthropic.com/v1/models"
flagship = "claude-opus-4-8"
fast = "claude-sonnet-5"
key_url = "https://console.anthropic.com/settings/keys"
price = [3.0, 15.0]

# The gpt-5.6 REASONING models (luna/sol/terra) cannot use function tools on
# /v1/chat/completions -- they need /v1/responses -- so every Waku turn 400s
# on them. The whole `-chat-latest` line is 404 deprecated, so falling back
# to it is not an option either. gpt-5.5 is the newest plain model that
# returns a tool_call on chat/completions; gpt-4.1-mini is a cheap
# tool-capable gate. A `-latest` alias is deliberately NOT used: it changes
# silently under a pinned benchmark, and test_openai_default_is_tool_capable
# rejects one.

[openai]
kind = "openai"
key_env = "OPENAI_API_KEY"
model = "gpt-5.5"
small_model = "gpt-4.1-mini"
catalog_url = "https://api.openai.com/v1/models"
key_url = "https://platform.openai.com/api-keys"
price = [2.5, 15.0]

# One key, every lab's models, and a $0 tier: the defaults below are ":free"
# ids, rate-limited to roughly 50 requests a day without credits.

[openrouter]
kind = "openai"
key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
model = "nvidia/nemotron-3-super-120b-a12b:free"
small_model = "google/gemma-4-26b-a4b-it:free"
key_url = "https://openrouter.ai/keys"
price = [1.0, 3.0]

