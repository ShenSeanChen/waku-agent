[project]
name = "waku-agent"
version = "0.1.1"
description = "A minimal, transparent, local-first Waku: harness + loop + memory + eval, in code you can read in an afternoon."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sean Chen (ShenSeanChen)" }]
requires-python = ">=3.11"
keywords = ["ai-agent", "llm", "agent-framework", "local-first", "llmops", "memory", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",   # anthropic wire format: Anthropic, Kimi, GLM, MiniMax
    "openai>=1.50",      # openai wire format: OpenAI, Gemini, DeepSeek (and embeddings)
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ShenSeanChen/waku-agent"
Repository = "https://github.com/ShenSeanChen/waku-agent"
Issues = "https://github.com/ShenSeanChen/waku-agent/issues"
Changelog = "https://github.com/ShenSeanChen/waku-agent/releases"

[project.scripts]
# Branded CLI: `waku dashboard`, `waku voice`, `waku` to chat, etc.
waku = "waku.__main__:main"

[project.optional-dependencies]
# Eval pillar: LLM-as-judge (deterministic evals need only pytest)
eval = [
    "pytest>=8.0",
    "deepeval>=2.0",
]
# LLM-Ops pillar: local trace dashboard (traces also always land in traces/*.jsonl)
tracing = [
    "arize-phoenix>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# Optional gateway: message your laptop from your phone
telegram = [
    "python-telegram-bot>=21.0",
]
# Optional write-through target for create_event; the local SQLite/ICS mock
# remains the default and source of truth.
gcal = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
    "httplib2>=0.22",
    # The browser consent flow. Without it the only way in is `gcloud auth
    # application-default login`, which is a developer ritual, not a sign-in.
    "google-auth-oauthlib>=1.0",
]
# Optional gateway: message Waku from Discord
discord = [
    "discord.py>=2.4",
]
# Optional gateway: WhatsApp via Meta Cloud API (needs a public URL — see docstring)
whatsapp = [
    "httpx>=0.25",
]
# Optional gateway: talk to your laptop. TTS uses macOS `say` by default;
# for the neural British voice: pip install kokoro soundfile (pulls torch).
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    # gateway/voice.py imports numpy directly (audio buffers). It happens to
    # arrive with faster-whisper today, but depending on a transitive dep is a
    # bug waiting for an upstream release — declare what we actually import.
    "numpy>=1.24",
]
# The beautiful neural voice (Kokoro-82M, Apache-2.0): British butler, fully
# local/offline. Heavier — pulls torch (~2GB). `uv pip install '.[voice-neural]'`
# and Waku auto-detects it; no env var needed.
voice-neural = [
    "kokoro>=0.9",
    "soundfile>=0.12",
]
# Optional semantic-memory upgrade path: Supabase pgvector (see launch-rag)
supabase = [
    "supabase>=2.0",
]
# Optional episodic-memory backend: Notion database
# Requires >=2.5: the adapter uses the data_sources API (Notion API 2025-09-03).
notion = [
    "notion-client>=2.5",
]
# Optional: connect MCP servers (.waku/mcp.json)
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    # Pinned EXACTLY: an unpinned linter means every ruff release can turn CI
    # red with zero code changes (happened 2026-07-24 — 0.16.0 shipped new
    # rules and 106 violations appeared overnight). Bump deliberately.
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# An sdist should be what you need to BUILD and TEST waku — source, bundled
# skills, schema, evals. Left alone it was 2.6 MB, and 2.5 MB of that was a
# whiteboard PNG and the .excalidraw sources, plus the agent tooling (.claude,
# .agents, .pi) that only matters inside this repo. All of it stays on GitHub,
# where people actually read it; none of it belongs in a package download.
[tool.hatch.build.targets.sdist]
exclude = [
    "docs", "examples", "pi-pokedex",
    ".claude", ".agents", ".pi", ".deepeval", ".github",
]

[tool.hatch.build.targets.wheel]
packages = ["waku"]

# The bundled skills live at the repo root because that is where contributors
# add them (CONTRIBUTING.md, CI's validate-skills job, `skills/community/`).
# But `packages = ["waku"]` ships only the package, so before 2026-07-31 a
# `pip install waku-agent` arrived with ZERO skills — procedural memory, one of
# the four pillars, silently absent while the dashboard shipped fine (it lives
# under waku/ops/static). Copying them in at build time keeps one contributor-
# facing location and still ships them; waku.memory.bundled_skill_dirs() looks
# in both places and explains why.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "waku/skills"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rules waku IGNORES on purpose — each is a deliberate style choice, not an
# oversight. If you're tempted to remove one, read the reason first:
ignore = [
    "BLE001",  # blind `except Exception` is the documented pattern: tools and
               # observers surface errors as text instead of crashing the loop
    "DTZ001", "DTZ005", "DTZ011",  # naive local datetimes are intentional —
               # daily trace files and workspace folders are named in the
               # user's local day, not UTC
    "S110",    # try/except/pass around optional integrations (OTel, extras)
    # RUF100 flags a `# noqa` for a rule that is no longer enabled. Because the
    # rules above are globally ignored, ANY `# noqa: BLE001` a contributor
    # writes — the natural, correct-looking thing to write next to a broad
    # `except Exception` — becomes a CI failure in a file they never touched.
    # That footgun blocked two community PRs (#14, #26) on 2026-07-26. Turning
    # RUF100 off costs us the ability to spot genuinely stale noqas; leaving it
    # on costs contributors a red CI they can't explain. Contributors win.
    "RUF100",
]
